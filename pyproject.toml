[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-reels"
version = "0.1.0"
description = "YouTube reels MVP: ingest and build 60s highlight from URL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Your Name" }
]
dependencies = [
  "typer>=0.9.0",
  "rich>=13.7.0",
  "python-dotenv>=1.0.0",
  "yt-dlp>=2024.10.01",
  "av>=10.0.0",
  "numpy>=1.24.0",
  "pysubs2>=1.6.1",
  "argostranslate>=1.9.6",
  "orjson>=3.9.15",
  "tqdm>=4.66.1"
]

[project.scripts]
reels = "reels.cli.main:app"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["reels*"]
